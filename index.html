<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--ccs en el head siempre y javascript abajo en el body-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Registro de persona</h1>
        <form id="formPersona">
            <fieldset>
                <legend>Datos personales</legend>
                <label for="">Nombre:</label>
                <input type="text" name="nombre" id="nombre" required>

                <label for="">Apellido:</label>
                <input type="text" name="apellido" id="apellido" required>

                <label for="">Edad:</label>
                <input type="number" name="edad" id="edad" required min="1">

                <label for="genero">Genero</label>
                <select name="genero" id="genero">
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otros">Otros</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Datos de contactos</legend>
                <label for="telefono">Telefono:</label>
                <input type="tel" name="telefono" id="telefono" required>

                <label for="email">Correo Electronico:</label>
                <input type="email" name="email" id="email" required>

                <label for="password">Contraseña:</label>
                <input type="password" name="password" id="password" required>
            </fieldset>

            <fieldset>
                <legend>Datos Adicionales</legend>
                <label for="direccion">Direccion:</label>
                <textarea id="direccion"></textarea>

                <label for="fecha">Fecha Nacimiento:</label>
                <input type="date" name="fecha" id="fecha" required>
            </fieldset>
            <br>
            <input type="submit" value="Guardar">

        </form>
    </div>
    <script>
        const personas = [];
        document.getElementById("formPersona").addEventListener("submit",function(event){
            event.preventDefault();

            const persona = {
            nombre: document.getElementById("nombre").value,
            apellido: document.getElementById("apellido").value,
            edad: document.getElementById("edad").value,
            genero: document.getElementById("genero").value,
            telefono: document.getElementById("telefono").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            direccion: document.getElementById("direccion").value,
            fecha: document.getElementById("fecha").value
            };
            personas.push(persona);
            alert(JSON.stringify(personas)); 
        }) 
          </script>
    <!--const es que va varia el valor, var es global, let solo se ve en la clase que se trabaja-->
</body>
</html>
