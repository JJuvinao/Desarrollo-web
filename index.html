<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="containerfrom-foto">
        <div class="form-container">
          <h1>Registro de persona</h1>
          <form id="formPersona">
            <fieldset>
              <legend>Datos personales</legend>
              <label for="nombre">Nombre:</label>
              <input type="text" name="nombre" id="nombre" required />

              <label for="apellido">Apellido:</label>
              <input type="text" name="apellido" id="apellido" required />

              <label for="edad">Edad:</label>
              <input type="number" name="edad" id="edad" required min="1" />

              <label for="genero">Genero</label>
              <select name="genero" id="genero">
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="Otros">Otros</option>
              </select>
            </fieldset>

            <fieldset>
              <legend>Datos de contactos</legend>
              <label for="telefono">Telefono:</label>
              <input type="tel" name="telefono" id="telefono" required />

              <label for="email">Correo Electronico:</label>
              <input type="email" name="email" id="email" required />

              <label for="password">Contraseña:</label>
              <input type="password" name="password" id="password" required />
            </fieldset>

            <fieldset>
              <legend>Datos Adicionales</legend>
              <label for="direccion">Direccion:</label>
              <textarea id="direccion"></textarea>

              <label for="fecha">Fecha Nacimiento:</label>
              <input type="date" name="fecha" id="fecha" required />
            </fieldset>
            <label for="Acepto terminos y condiciones" class="checkbox-label">
                <span>Acepto terminos y condiciones:</span>
                <input type="checkbox" name="checkbox" id="terminos-cond"/>
            </label>    
            <input type="color" name="cambiocolor" id="">        
            <input type="file" id="imagen" accept="imagen"/>
            <input type="submit" value="Guardar" id="submitBtn" disabled/>
          </form>
        </div>
        <div class="preview-container">
          <h2>Foto de perfil</h2>
          <br />
          <img
            id="preview"
            class="image-frame"
            src=""
            alt="Vistaimagen"
            style="display: none"
          />
        </div>
      </div>
      <div class="table-container">
        <h1>Tabla de personas</h1>
        <table class="styled-table" id="tablaPersonas">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Edad</th>
              <th>Genero</th>
              <th>Telefono</th>
              <th>Email</th>
              <th>Direccion</th>
              <th>Fecha Nacimiento</th>
              <th>Foto</th>
            </tr>
          </thead>
          <tbody>
            <tr></tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
      const personas = [];
      document
        .getElementById("formPersona")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const reader = new FileReader();
          const file = document.getElementById("imagen").files[0];
          reader.onloadend = function () {
            const persona = {
              nombre: document.getElementById("nombre").value,
              apellido: document.getElementById("apellido").value,
              edad: document.getElementById("edad").value,
              genero: document.getElementById("genero").value,
              telefono: document.getElementById("telefono").value,
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
              direccion: document.getElementById("direccion").value,
              fecha: document.getElementById("fecha").value,
              imagen: reader.result
            };
            personas.push(persona);

            const tabla = document
              .getElementById("tablaPersonas")
              .getElementsByTagName("tbody")[0];
            const nuevaFila = tabla.insertRow();

            nuevaFila.insertCell(0).textContent = persona.nombre;
            nuevaFila.insertCell(1).textContent = persona.apellido;
            nuevaFila.insertCell(2).textContent = persona.edad;
            nuevaFila.insertCell(3).textContent = persona.genero;
            nuevaFila.insertCell(4).textContent = persona.telefono;
            nuevaFila.insertCell(5).textContent = persona.email;
            nuevaFila.insertCell(6).textContent = persona.direccion;
            nuevaFila.insertCell(7).textContent = persona.fecha;
            const imgCell = nuevaFila.insertCell(8);
            const img = document.createElement("img");
            img.src = persona.imagen;
            img.style.maxWidth = "100px";
            img.style.height = "auto";
            imgCell.appendChild(img);

            alert(JSON.stringify(personas));
          };
          if (file) {
            reader.readAsDataURL(file);
          }
        });

      document
        .getElementById("imagen")
        .addEventListener("change", function (event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              const preview = document.getElementById("preview");
              preview.src = e.target.result;
              preview.style.display = "block";
            };
            reader.readAsDataURL(file);
          }
        });

      document
        .getElementById("terminos-cond")
        .addEventListener("change", function (event) {
          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = !event.target.checked;
        });
    </script>
  </body>
</html>
